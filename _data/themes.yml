# -----------------------------------------------------------------------------
# Research themes — the cards under "Research" on the homepage.
#
#   id:       matches the "topics" list of each paper in _data/research.json
#   question: the guiding question, one line
#   page:     URL of the theme's own page. The card links there once that page
#             is published; until then it links to the related papers.
#   icon:     dendrogram | communities | network
# -----------------------------------------------------------------------------

- id: hierarchical-clustering
  title: Hierarchical clustering
  question: Which properties should a hierarchical clustering method satisfy, and which methods satisfy them?
  page: /research/hierarchical-clustering/
  icon: dendrogram

- id: community-detection
  title: Hierarchical community detection
  question: When can nested communities in a network be recovered, and which algorithms recover them?
  icon: communities

- id: network-dynamics
  title: Dynamics on networks
  question: How does local network structure shape collective opinion dynamics?
  icon: network
