<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Well-separated sets</title>
<desc id="d">Three panels. (a) A set of points whose largest internal distance is smaller than its smallest distance to the other points: it is well separated. (b) A stretched-out set whose largest internal distance is larger than its distance to a nearby point: it is not well separated. (c) A small data set with all its well-separated sets outlined; they are nested and form a hierarchy.</desc>
