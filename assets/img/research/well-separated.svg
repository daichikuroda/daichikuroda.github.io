<text x="182.0" y="30.0" font-size="11" font-weight="400" fill="#1b2329" text-anchor="start" >largest distance inside the set</text>
<line x1="390.0" y1="26.0" x2="416.0" y2="26.0" stroke="#b26b12" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="422.0" y="30.0" font-size="11" font-weight="400" fill="#1b2329" text-anchor="start" >smallest distance to the other points</text>
