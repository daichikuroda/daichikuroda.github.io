<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The four axioms of admissibility</title>
<desc id="d">Four panels, each showing data before and after a change. Scale invariance: enlarging all distances keeps the same clusters. Partition richness: for any chosen grouping of the points, some data make these groups clusters. Partition consistency: pulling the points of each cluster together and pushing clusters apart keeps these clusters, while new smaller clusters may appear. Permutation invariance: renaming the points renames the clusters in the same way.</desc>
