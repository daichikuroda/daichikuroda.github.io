<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">A hierarchy as nested clusters and as a tree</title>
<desc id="d">Three panels. (a) Seven points a to g with nested clusters: {a,b} inside {a,b,c}, {f,g} inside {d,e,f,g}, all inside the whole set. (b) The same hierarchy drawn as a tree, with the whole set at the root and single points as leaves. (c) Two clusters {a,b,c} and {c,d} that overlap without one containing the other: they cannot both belong to a hierarchy.</desc>
