<title id="t">Admissible methods ordered by refinement</title>
<desc id="d">Left: a 5 by 5 dissimilarity matrix. Right: three hierarchies of the same five points, arranged from coarse (bottom) to fine (top). Global separation finds {1,2}; single linkage adds {1,2,3} and {1,2,3,5}; stable clusters add {1,2,3} and {1,2,3,4} instead. The two top hierarchies cannot be combined because {1,2,3,5} and {1,2,3,4} overlap without being nested.</desc>
