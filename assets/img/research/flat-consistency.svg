<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Why consistency is a problem for flat clustering</title>
<desc id="d">Three panels. (a) Data with two clusters: a loose ring of six points, three filled and three hollow, and a small group of three points. (b) After a strengthening, the filled and hollow points form two tight groups next to each other and the small group is further away; a consistent flat method must still return the same two clusters. (c) On the same data, a hierarchy keeps the big cluster and adds the two tight groups inside it.</desc>
<rect width="720" height="262" rx="12" fill="#ffffff"/>
<rect x="12" y="12" width="226" height="210" rx="12" fill="#f5f8f8"/>
<text x="125.0" y="248.0" font-size="13" font-weight="600" fill="#1b2329" text-anchor="middle" >(a) Before</text>
<rect x="250" y="12" width="226" height="210" rx="12" fill="#f5f8f8"/>
<text x="363.0" y="248.0" font-size="13" font-weight="600" fill="#1b2329" text-anchor="middle" >(b) After: flat clustering</text>
<rect x="488" y="12" width="226" height="210" rx="12" fill="#f5f8f8"/>
<text x="601.0" y="248.0" font-size="13" font-weight="600" fill="#1b2329" text-anchor="middle" >(c) After: hierarchy</text>
