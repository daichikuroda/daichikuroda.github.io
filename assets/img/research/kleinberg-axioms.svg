<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Strengthening and Kleinberg's three axioms</title>
<desc id="d">Four panels, each showing data before and after a change. Strengthening: distances inside each cluster shrink and distances between clusters grow. Scale invariance: enlarging all distances keeps the same clusters. Richness: for any chosen grouping of the points, some data make this grouping the output. Consistency: after pulling the points of each cluster together and pushing clusters apart, the output stays the same.</desc>
